<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #202938;
      padding: 30px 16px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      margin-bottom: 25px;
    }

    header h1 {
      color: #4f46e5;
      margin-bottom: 8px;
    }

    header p {
      color: #64748b;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card, .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #1e293b0a;
    }

    .card p {
      color: #64748b;
      margin-bottom: 10px;
    }

    .card h2 {
      font-size: 28px;
      color: #4f46e5;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-bottom: 24px;
    }

    .panel h2 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input, select, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      width: 100%;
      background: white;
    }

    input:focus, select:focus {
      outline: 2px solid #a5b4fc;
      border-color: #4f46e5;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .add-button {
      background: #4f46e5;
      color: white;
      align-self: end;
    }

    .add-button:hover {
      background: #3730a3;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      color: #64748b;
      font-size: 13px;
    }

    .delete-button {
      color: #dc2626;
      background: #fee2e2;
      padding: 8px 10px;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 24px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 550px) {
      .summary, form {
        grid-template-columns: 1fr;
      }

      .card h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>Expense Tracker</h1>
      <p>Track your spending. Manage your money.</p>
    </header>

    <section class="summary">
      <div class="card">
        <p>Total Expenses</p>
        <h2 id="total">₹0.00</h2>
      </div>

      <div class="card">
        <p>Number of Expenses</p>
        <h2 id="count">0</h2>
      </div>
    </section>

    <section class="panel">
      <h2>Add a New Expense</h2>

      <form id="expense-form">
        <div class="field">
          <label for="description">Description</label>
          <input
            id="description"
            type="text"
            placeholder="e.g. Lunch"
            maxlength="100"
            required
          >
        </div>

        <div class="field">
          <label for="amount">Amount (₹)</label>
          <input
            id="amount"
            type="number"
            placeholder="e.g. 250"
            min="0.01"
            max="1000000000"
            step="0.01"
            required
          >
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input id="date" type="date" required>
        </div>

        <button class="add-button" type="submit">
          + Add Expense
        </button>
      </form>
    </section>

    <section class="panel">
      <h2>Recent Expenses</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th>Category</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expense-list"></tbody>
        </table>
      </div>

      <p id="empty-message" class="empty">
        No expenses yet. Add your first expense!
      </p>
    </section>

    <p class="footer">
      Personal Expense Tracker · Built with HTML, CSS & JavaScript
    </p>
  </main>

  <script>
    const form = document.getElementById("expense-form");
    const descriptionInput = document.getElementById("description");
    const amountInput = document.getElementById("amount");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const expenseList = document.getElementById("expense-list");
    const totalElement = document.getElementById("total");
    const countElement = document.getElementById("count");
    const emptyMessage = document.getElementById("empty-message");

    const currency = new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR"
    });

    let expenses = [];

    try {
      const saved = JSON.parse(
        localStorage.getItem("personal-expenses") || "[]"
      );

      if (Array.isArray(saved)) {
        expenses = saved.filter(item =>
          item &&
          typeof item.id === "string" &&
          typeof item.description === "string" &&
          typeof item.amount === "number" &&
          Number.isFinite(item.amount) &&
          item.amount > 0 &&
          typeof item.category === "string" &&
          typeof item.date === "string"
        );
      }
    } catch {
      expenses = [];
    }

    function saveExpenses() {
      try {
        localStorage.setItem(
          "personal-expenses",
          JSON.stringify(expenses)
        );
      } catch {
        alert("Could not save data in this browser.");
      }
    }

    function createCell(value) {
      const cell = document.createElement("td");
      cell.textContent = value;
      return cell;
    }

    function renderExpenses() {
      expenseList.replaceChildren();

      let total = 0;

      expenses.forEach(expense => {
        total += expense.amount;

        const row = document.createElement("tr");

        row.appendChild(createCell(expense.description));
        row.appendChild(createCell(expense.category));
        row.appendChild(createCell(expense.date));
        row.appendChild(createCell(currency.format(expense.amount)));

        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.setAttribute(
          "aria-label",
          "Delete " + expense.description
        );

        deleteButton.addEventListener("click", () => {
          expenses = expenses.filter(item => item.id !== expense.id);
          saveExpenses();
          renderExpenses();
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);
        expenseList.appendChild(row);
      });

      totalElement.textContent = currency.format(total);
      countElement.textContent = expenses.length;
      emptyMessage.hidden = expenses.length > 0;
    }

    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    dateInput.value = getLocalDate();

    form.addEventListener("submit", event => {
      event.preventDefault();

      const description = descriptionInput.value.trim();
      const amount = Number(amountInput.value);
      const category = categoryInput.value;
      const date = dateInput.value;

      if (
        !description ||
        !Number.isFinite(amount) ||
        amount <= 0 ||
        amount > 1000000000 ||
        !date
      ) {
        alert("Please enter valid expense details.");
        return;
      }

      expenses.unshift({
        id: crypto.randomUUID(),
        description,
        amount,
        category,
        date
      });

      saveExpenses();
      renderExpenses();
      form.reset();
      dateInput.value = getLocalDate();
      descriptionInput.focus();
    });

    renderExpenses();
  </script>
</body>
</html>
